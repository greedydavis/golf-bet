name: 測試並部署

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      # 沒有設定 Supabase 時不部署：示範模式的資料只存在瀏覽器，放上正式網址容易讓人誤以為資料已經存起來
      - id: check
        run: |
          if [ -n "$VITE_SUPABASE_URL" ] && [ -n "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::尚未設定 repo 變數 VITE_SUPABASE_URL、VITE_SUPABASE_ANON_KEY，這次只跑測試，不部署。"
          fi
      - if: steps.check.outputs.configured == 'true'
        uses: actions/checkout@v7
      - if: steps.check.outputs.configured == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - if: steps.check.outputs.configured == 'true'
        run: npm ci && npm run build
      - if: steps.check.outputs.configured == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.configured == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # 成績卡辨識的 Edge Function：設定了 SUPABASE_ACCESS_TOKEN（secret）與 SUPABASE_PROJECT_REF（variable）才部署
  function:
    needs: test
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - id: check
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$PROJECT_REF" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::尚未設定 SUPABASE_ACCESS_TOKEN（secret）與 SUPABASE_PROJECT_REF（variable），這次不部署 Edge Function。"
          fi
      - if: steps.check.outputs.configured == 'true'
        uses: actions/checkout@v7
      - if: steps.check.outputs.configured == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - if: steps.check.outputs.configured == 'true'
        run: supabase functions deploy recognize-scorecard --project-ref "$PROJECT_REF"
