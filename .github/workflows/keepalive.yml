name: Supabase 保活

# Supabase 免費專案連續 7 天沒有使用會被暫停。每 3 天呼叫一次資料庫的 ping()（只回傳時間，不讀寫資料）。
# 失敗時 GitHub 會寄信通知：多半是專案已被暫停，要到 Supabase 後台按 Restore。
# 注意：repo 連續 60 天沒有任何 commit 時，GitHub 會自動停用排程（會先寄信），到 Actions 頁面按 Enable 即可恢復。

on:
  schedule:
    - cron: '17 1 */3 * *' # 每月 1、4、7…日 UTC 01:17（台灣 09:17）
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      SUPABASE_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: 呼叫 ping()
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::尚未設定 repo 變數 VITE_SUPABASE_URL、VITE_SUPABASE_ANON_KEY"
            exit 1
          fi
          call() {
            curl -sS -m 30 -o body.txt -w '%{http_code}' -X POST "$SUPABASE_URL/rest/v1/rpc/$1" \
              -H "apikey: $SUPABASE_KEY" -H 'Content-Type: application/json' -d '{}' || echo 000
          }
          # 專案剛被喚醒時可能要等一下，最多試 5 次
          for i in 1 2 3 4 5; do
            code=$(call ping)
            if [ "$code" = "200" ]; then
              echo "ping 成功：$(cat body.txt)"
              exit 0
            fi
            if [ "$code" = "404" ]; then
              # 資料庫還沒安裝 ping()：退而求其次，確認資料庫有回應（未登入呼叫 me 會被拒絕，回 401）
              code=$(call me)
              if [ "$code" = "401" ]; then
                echo "::warning::資料庫尚未安裝 ping()（supabase/migrations/20261004000004_ping.sql）。資料庫有回應，但這種呼叫不保證會被算成使用紀錄。"
                exit 0
              fi
            fi
            echo "第 $i 次：HTTP $code，20 秒後重試"
            sleep 20
          done
          echo "::error::Supabase 沒有回應（HTTP $code）。專案可能已被暫停，請到 Supabase 後台按 Restore。"
          exit 1
